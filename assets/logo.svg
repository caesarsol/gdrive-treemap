<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Drive Treemap: treemap tiles in the app's colours, with a soft glow around them (not between them). -->
  <defs>
    <g id="tiles">
      <rect x="20.00" y="20.00" width="46.32" height="80.00" fill="#66bfff"/>
      <rect x="68.42" y="20.00" width="31.58" height="42.11" fill="#30d158"/>
      <rect x="68.42" y="64.21" width="16.84" height="35.79" fill="#ffd60a"/>
      <rect x="87.37" y="64.21" width="12.63" height="18.95" fill="#ff99c4"/>
      <rect x="87.37" y="85.26" width="12.63" height="14.74" fill="#ff9f0a"/>
    </g>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <mask id="outside">
      <rect width="120" height="120" fill="white"/>
      <rect x="20" y="20" width="80.00" height="80.00" fill="black" fill-opacity="0.5"/>
    </mask>
  </defs>
  <g mask="url(#outside)"><use href="#tiles" filter="url(#blur)"/></g>
  <use href="#tiles"/>
</svg>
